{% extends "admin/base.html" %}
{% block title %}Subcategory{% endblock %}
{% block page_title %}{{ 'Edit Subcategory' if subcategory else 'New Subcategory' }}{% endblock %}
{% block content %}
<div class="card col-lg-8">
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="row">
        <div class="col-md-6 mb-2"><label class="form-label small">Name (English) *</label>
          <input class="form-control form-control-sm" name="name_en" required value="{{ subcategory.name_en if subcategory else '' }}"></div>
        <div class="col-md-6 mb-2"><label class="form-label small">नाम (हिन्दी)</label>
          <input class="form-control form-control-sm" name="name_hi" value="{{ subcategory.name_hi or '' if subcategory else '' }}"></div>
        <div class="col-md-6 mb-2"><label class="form-label small">Category *</label>
          <select class="form-select form-select-sm" name="category_id" required {{ 'disabled' if subcategory }}>
            {% for c in categories %}<option value="{{ c.id }}" {{ 'selected' if subcategory and subcategory.category_id == c.id }}>{{ c.name_en }}</option>{% endfor %}
          </select>
          {% if subcategory %}<input type="hidden" name="category_id" value="{{ subcategory.category_id }}">{% endif %}
        </div>
        <div class="col-md-6 mb-2"><label class="form-label small">Icon (Bootstrap class)</label>
          <input class="form-control form-control-sm" name="icon" value="{{ subcategory.icon or '' if subcategory else '' }}"></div>
        <div class="col-md-6 mb-2"><label class="form-label small">Description (English)</label>
          <textarea class="form-control form-control-sm" name="description_en" rows="2">{{ subcategory.description_en or '' if subcategory else '' }}</textarea></div>
        <div class="col-md-6 mb-2"><label class="form-label small">विवरण (हिन्दी)</label>
          <textarea class="form-control form-control-sm" name="description_hi" rows="2">{{ subcategory.description_hi or '' if subcategory else '' }}</textarea></div>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" name="is_active" id="subActive" {{ 'checked' if not subcategory or subcategory.is_active }}>
        <label class="form-check-label small" for="subActive">Active</label>
      </div>
      <button class="btn btn-primary btn-sm">{{ 'Save Changes' if subcategory else 'Create Subcategory' }}</button>
      <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('admin.subcategories_list') }}">Back</a>
    </form>
  </div>
</div>
{% endblock %}
