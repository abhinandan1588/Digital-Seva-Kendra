{% extends "admin/base.html" %}
{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card">
      <div class="card-header fw-bold">Change Password</div>
      <div class="card-body">
        <form method="post" action="{{ url_for('auth.change_password') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-2"><label class="form-label small">Current password *</label>
            <input type="password" class="form-control" name="current_password" required></div>
          <div class="mb-2"><label class="form-label small">New password (min 8 chars) *</label>
            <input type="password" class="form-control" name="new_password" required minlength="8"></div>
          <div class="mb-3"><label class="form-label small">Confirm new password *</label>
            <input type="password" class="form-control" name="confirm_password" required minlength="8"></div>
          <button class="btn btn-primary">Change Password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
