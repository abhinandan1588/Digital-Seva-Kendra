{% extends "admin/base.html" %}
{% block title %}Category{% endblock %}
{% block page_title %}Edit Category{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header fw-bold">Edit Category: {{ category.name_en }}</div>
      <div class="card-body">
        <form method="post" enctype="multipart/form-data" action="{{ url_for('admin.category_edit', category_id=category.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-2"><label class="form-label small">Name (English) *</label>
            <input class="form-control form-control-sm" name="name_en" required value="{{ category.name_en }}"></div>
          <div class="mb-2"><label class="form-label small">नाम (हिन्दी)</label>
            <input class="form-control form-control-sm" name="name_hi" value="{{ category.name_hi or '' }}"></div>
          <div class="mb-2"><label class="form-label small">Description (English)</label>
            <textarea class="form-control form-control-sm" name="description_en" rows="2">{{ category.description_en or '' }}</textarea></div>
          <div class="mb-2"><label class="form-label small">विवरण (हिन्दी)</label>
            <textarea class="form-control form-control-sm" name="description_hi" rows="2">{{ category.description_hi or '' }}</textarea></div>
          <div class="mb-2"><label class="form-label small">Bootstrap icon class</label>
            <input class="form-control form-control-sm" name="icon" value="{{ category.icon or '' }}"></div>
          <div class="mb-2"><label class="form-label small">Group (homepage section / admin lists)</label>
            <select class="form-select form-select-sm" name="group">
              {% for value, label in groups %}
              <option value="{{ value }}" {{ 'selected' if category and category.group == value }}>{{ label }}</option>
              {% endfor %}
            </select></div>
          <div class="mb-2"><label class="form-label small">Image</label>
            <input class="form-control form-control-sm" type="file" name="image" accept=".png,.jpg,.jpeg,.webp">
            {% if category.image_path %}<img src="{{ url_for('static', filename=category.image_path) }}" class="mt-1" style="height:40px">{% endif %}</div>
          <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="is_active" id="catActive" {{ 'checked' if category.is_active }}><label class="form-check-label small" for="catActive">Active</label></div>
          <button class="btn btn-primary btn-sm">Save Changes</button>
          <a class="btn btn-link btn-sm" href="{{ url_for('admin.categories_list') }}">Back</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
