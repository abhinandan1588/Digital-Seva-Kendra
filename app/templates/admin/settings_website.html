{% extends "admin/base.html" %}
{% block title %}Website Settings{% endblock %}
{% block page_title %}Website Settings{% endblock %}
{% block content %}
<form method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row g-4">
    <div class="col-lg-6">
      <div class="card mb-3">
        <div class="card-header fw-bold">Shop identity</div>
        <div class="card-body">
          <div class="mb-2"><label class="form-label small">Shop name (English)</label>
            <input class="form-control form-control-sm" name="shop_name" value="{{ settings.shop_name }}"></div>
          <div class="mb-2"><label class="form-label small">दुकान का नाम (हिन्दी)</label>
            <input class="form-control form-control-sm" name="shop_name_hi" value="{{ settings.shop_name_hi }}"></div>
          <div class="mb-2"><label class="form-label small">Tagline (English)</label>
            <input class="form-control form-control-sm" name="shop_tagline" value="{{ settings.shop_tagline }}"></div>
          <div class="mb-2"><label class="form-label small">टैगलाइन (हिन्दी)</label>
            <input class="form-control form-control-sm" name="shop_tagline_hi" value="{{ settings.shop_tagline_hi }}"></div>
          <div class="mb-2"><label class="form-label small">Logo</label>
            <input class="form-control form-control-sm" type="file" name="logo" accept=".png,.jpg,.jpeg,.webp">
            {% if settings.shop_logo_path %}<img src="{{ url_for('static', filename=settings.shop_logo_path) }}" style="height:36px" class="mt-1">{% endif %}</div>
          <div class="mb-0"><label class="form-label small">Default language</label>
            <select class="form-select form-select-sm" name="default_language">
              <option value="en" {{ 'selected' if settings.default_language == 'en' }}>English</option>
              <option value="hi" {{ 'selected' if settings.default_language == 'hi' }}>हिन्दी</option>
            </select></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header fw-bold">Contact & hours</div>
        <div class="card-body">
          <div class="mb-2"><label class="form-label small">Address</label>
            <textarea class="form-control form-control-sm" name="shop_address" rows="2">{{ settings.shop_address }}</textarea></div>
          <div class="row">
            <div class="col-6 mb-2"><label class="form-label small">Mobile</label>
              <input class="form-control form-control-sm" name="shop_mobile" value="{{ settings.shop_mobile }}"></div>
            <div class="col-6 mb-2"><label class="form-label small">WhatsApp</label>
              <input class="form-control form-control-sm" name="shop_whatsapp" value="{{ settings.shop_whatsapp }}"></div>
            <div class="col-6 mb-2"><label class="form-label small">Email</label>
              <input class="form-control form-control-sm" name="shop_email" value="{{ settings.shop_email }}"></div>
            <div class="col-6 mb-2"><label class="form-label small">Working hours</label>
              <input class="form-control form-control-sm" name="working_hours" value="{{ settings.working_hours }}"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="card mb-3">
        <div class="card-header fw-bold">Homepage content (bilingual)</div>
        <div class="card-body">
          <div class="mb-2"><label class="form-label small">Banner title (English)</label>
            <input class="form-control form-control-sm" name="homepage_banner_title" value="{{ settings.homepage_banner_title }}"></div>
          <div class="mb-2"><label class="form-label small">बैनर शीर्षक (हिन्दी)</label>
            <input class="form-control form-control-sm" name="homepage_banner_title_hi" value="{{ settings.homepage_banner_title_hi }}"></div>
          <div class="mb-2"><label class="form-label small">Banner subtitle (English)</label>
            <textarea class="form-control form-control-sm" name="homepage_banner_subtitle" rows="2">{{ settings.homepage_banner_subtitle }}</textarea></div>
          <div class="mb-2"><label class="form-label small">बैनर उपशीर्षक (हिन्दी)</label>
            <textarea class="form-control form-control-sm" name="homepage_banner_subtitle_hi" rows="2">{{ settings.homepage_banner_subtitle_hi }}</textarea></div>
          <div class="mb-2"><label class="form-label small">Footer text (English)</label>
            <textarea class="form-control form-control-sm" name="footer_text" rows="3">{{ settings.footer_text }}</textarea></div>
          <div class="mb-0"><label class="form-label small">फुटर पाठ (हिन्दी)</label>
            <textarea class="form-control form-control-sm" name="footer_text_hi" rows="3">{{ settings.footer_text_hi }}</textarea></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header fw-bold">Social & legal pages</div>
        <div class="card-body">
          <div class="row">
            <div class="col-4 mb-2"><label class="form-label small">Facebook URL</label>
              <input class="form-control form-control-sm" name="social_facebook" value="{{ settings.social_facebook }}"></div>
            <div class="col-4 mb-2"><label class="form-label small">Instagram URL</label>
              <input class="form-control form-control-sm" name="social_instagram" value="{{ settings.social_instagram }}"></div>
            <div class="col-4 mb-2"><label class="form-label small">YouTube URL</label>
              <input class="form-control form-control-sm" name="social_youtube" value="{{ settings.social_youtube }}"></div>
          </div>
          <div class="mb-2"><label class="form-label small">Privacy policy (English) - shown on /privacy</label>
            <textarea class="form-control form-control-sm" name="privacy_policy" rows="4">{{ settings.privacy_policy }}</textarea></div>
          <div class="mb-2"><label class="form-label small">गोपनीयता नीति (हिन्दी)</label>
            <textarea class="form-control form-control-sm" name="privacy_policy_hi" rows="3">{{ settings.privacy_policy_hi }}</textarea></div>
          <div class="mb-2"><label class="form-label small">Terms & conditions (English) - shown on /terms</label>
            <textarea class="form-control form-control-sm" name="terms_conditions" rows="4">{{ settings.terms_conditions }}</textarea></div>
          <div class="mb-0"><label class="form-label small">नियम एवं शर्तें (हिन्दी)</label>
            <textarea class="form-control form-control-sm" name="terms_conditions_hi" rows="3">{{ settings.terms_conditions_hi }}</textarea></div>
        </div>
      </div>
    </div>
  </div>
  <div class="mt-3"><button class="btn btn-primary">Save Website Settings</button></div>
</form>
{% endblock %}
